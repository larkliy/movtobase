<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-seg-read" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-seg-active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-seg-write" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Внутренности System.IO.Pipelines: Цепочка BufferSegment</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">Связный список сегментов памяти: ReadOnlySequence&lt;byte&gt; и управление позициями Consumed / Examined</text>

  <!-- Segment chain visual -->
  <g transform="translate(40, 105)">
    <!-- Segment 0: Already consumed / recycled -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#8b949e">BufferSegment [0]</text>
    <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#6e7681">Полностью прочитан</text>
    <rect x="15" y="60" width="190" height="35" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="25" y="82" font-family="sans-serif" font-size="11" fill="#8b949e">Memory&lt;byte&gt; (4096 B)</text>
    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#34d399">✓ Возвращен в MemoryPool</text>

    <!-- Link 0 -> 1 -->
    <path d="M 225,75 L 265,75 M 255,70 L 265,75 L 255,80" stroke="#484f58" stroke-width="2" fill="none"/>

    <!-- Segment 1: Head of reader (ReadOnlySequence Start) -->
    <rect x="270" y="0" width="260" height="150" rx="8" fill="url(#grad-seg-read)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#60a5fa">BufferSegment [1] (_readHead)</text>
    <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#c9d1d9">Активное чтение протокола</text>
    
    <!-- Buffer bar with consumed and unconsumed -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="90" height="35" rx="3" fill="#1e293b" stroke="#3b82f6"/>
      <text x="8" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">Consumed</text>

      <rect x="95" y="0" width="135" height="35" rx="3" fill="#10b981" fill-opacity="0.3" stroke="#10b981"/>
      <text x="105" y="22" font-family="sans-serif" font-size="10" font-weight="600" fill="#a7f3d0">Unconsumed</text>
    </g>
    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#93c5fd">_readHeadIndex -&gt; ReadOnlySequence.Start</text>

    <!-- Link 1 -> 2 -->
    <path d="M 535,75 L 575,75 M 565,70 L 575,75 L 565,80" stroke="#3b82f6" stroke-width="2" fill="none"/>

    <!-- Segment 2: Tail of writer (_writingHead) -->
    <rect x="580" y="0" width="240" height="150" rx="8" fill="url(#grad-seg-write)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#fbbf24">BufferSegment [2] (_writingHead)</text>
    <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#c9d1d9">Сюда сокет пишет байты</text>

    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="120" height="35" rx="3" fill="#10b981" fill-opacity="0.3" stroke="#10b981"/>
      <text x="10" y="22" font-family="sans-serif" font-size="10" font-weight="600" fill="#a7f3d0">Written bytes</text>

      <rect x="125" y="0" width="85" height="35" rx="3" fill="#21262d" stroke="#f59e0b" stroke-dasharray="3"/>
      <text x="135" y="22" font-family="sans-serif" font-size="10" fill="#fbbf24">Free space</text>
    </g>
    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#fcd34d">GetMemory() / Advance()</text>
  </g>

  <!-- AdvanceTo and Backpressure Explanation -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="820" height="155" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Ключевая логика: AdvanceTo(consumed, examined) и Backpressure</text>
    
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9">
      • <tspan font-family="monospace" fill="#60a5fa">consumed</tspan>: Указывает байты, которые приложение уже разобрало. Пайп освобождает сегменты левее этой позиции и возвращает их в пул.
    </text>
    <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#c9d1d9">
      • <tspan font-family="monospace" fill="#34d399">examined</tspan>: Указывает, до какого места буфер проинспектирован. Если целое сообщение еще не собралось, <tspan font-family="monospace">ReadAsync()</tspan> заснет до прибытия новых байтов, предотвращая 100% spinlock CPU.
    </text>
    <text x="20" y="108" font-family="sans-serif" font-size="12" fill="#c9d1d9">
      • <tspan font-weight="600" fill="#fbbf24">Backpressure</tspan>: Если <tspan font-family="monospace">_unconsumedBytes &gt; PauseWriterThreshold</tspan> (по умолчанию 64 КБ), вызов <tspan font-family="monospace">FlushAsync()</tspan> сокета приостанавливается, пока парсер не разгребет очередь. Сервер никогда не падает с OutOfMemory.
    </text>
  </g>
</svg>
