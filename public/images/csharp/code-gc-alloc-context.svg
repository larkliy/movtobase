  <text x="53" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">204</text>
  <text x="79" y="210" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#E6EDF3">    </tspan><tspan fill="#FF7B72">uint8_t*</tspan><tspan fill="#E6EDF3">       alloc_limit;</tspan></text>
  <text x="53" y="232" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">205</text>
  <text x="79" y="232" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#E6EDF3">    </tspan><tspan fill="#FF7B72">int64_t</tspan><tspan fill="#E6EDF3">        alloc_bytes;</tspan><tspan fill="#8B949E"> //Number of bytes allocated on SOH by this context</tspan></text>
