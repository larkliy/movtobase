  <text x="53" y="276" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">207</text>
  <text x="79" y="276" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">    // These two fields are deliberately not exposed past the EE-GC interface.</tspan></text>
