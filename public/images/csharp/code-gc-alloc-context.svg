  <text x="53" y="78" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">198</text>
  <text x="79" y="78" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// The allocation context must be known to the VM for use in the allocation</tspan></text>
  <text x="53" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">199</text>
  <text x="79" y="100" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// fast path and known to the GC for performing the allocation. Every Thread</tspan></text>
  <text x="53" y="122" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">200</text>
  <text x="79" y="122" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// has its own allocation context that it hands to the GC when allocating.</tspan></text>
  <text x="53" y="144" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">201</text>
  <text x="79" y="144" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#FF7B72">struct</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#FFA657">gc_alloc_context</tspan></text>
  <text x="53" y="166" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">202</text>
