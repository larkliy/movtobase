<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <filter id="shadow-code-gc-regions-invariants" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="496" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#shadow-code-gc-regions-invariants)"/>

  <!-- Title bar -->
  <path d="M 3,2 L 877,2 Q 878,2 878,12 L 878,42 L 2,42 L 2,12 Q 2,2 3,2 Z" fill="#161b22"/>
  <line x1="2" y1="42" x2="878" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="20" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="21" r="6" fill="#27c93f"/>

  <!-- Title / Path -->
  <text x="80" y="25.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#8b949e">src/coreclr/gc/gcpriv.h:135-153 — Инварианты регионов в CoreCLR GC</text>

  <!-- Line numbers separator -->
  <line x1="65" y1="42" x2="65" y2="498" stroke="#21262d" stroke-width="1"/>

  <!-- Code content -->
  <text x="53" y="78" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">135</text>
  <text x="79" y="78" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">/* the following section defines the optional features */</tspan></text>
  <text x="53" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">136</text>
  <text x="79" y="100" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"></text>
  <text x="53" y="122" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">137</text>
  <text x="79" y="122" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// Regions invariants -</tspan></text>
  <text x="53" y="144" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">138</text>
  <text x="79" y="144" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">//</tspan></text>
  <text x="53" y="166" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">139</text>
  <text x="79" y="166" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// + each generation consists of 1+ regions.</tspan></text>
  <text x="53" y="188" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">140</text>
  <text x="79" y="188" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// + a region is in a contiguous address range; different regions could have</tspan></text>
  <text x="53" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">141</text>
  <text x="79" y="210" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">//   gaps inbetween.</tspan></text>
  <text x="53" y="232" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">142</text>
  <text x="79" y="232" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// + a region cannot contain more than one generation.</tspan></text>
  <text x="53" y="254" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">143</text>
  <text x="79" y="254" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">//</tspan></text>
  <text x="53" y="276" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">144</text>
  <text x="79" y="276" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// This means any empty regions can be freely used for any generation. For</tspan></text>
  <text x="53" y="298" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">145</text>
  <text x="79" y="298" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// Server GC we will balance regions between heaps.</tspan></text>
  <text x="53" y="320" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">146</text>
  <text x="79" y="320" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// For now disable regions for standalone GC builds</tspan></text>
  <text x="53" y="342" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">147</text>
  <text x="79" y="342" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// For SunOS or illumos this is temporary, until we can add MAP_PRIVATE</tspan></text>
  <text x="53" y="364" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">148</text>
  <text x="79" y="364" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// to the mmap() calls in unix/gcenv.unix.cpp  More details here:</tspan></text>
  <text x="53" y="386" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">149</text>
  <text x="79" y="386" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">//    https://github.com/dotnet/runtime/issues/104211</tspan></text>
  <text x="53" y="408" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">150</text>
  <text x="79" y="408" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// Apple non-macOS platforms (such as iOS, tvOS, and Mac Catalyst) disallow</tspan></text>
  <text x="53" y="430" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">151</text>
  <text x="79" y="430" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">// the large virtual address space reservations that GC regions require.</tspan></text>
  <text x="53" y="452" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">152</text>
  <text x="79" y="452" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#FF7B72">#if</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#D2A8FF">defined</tspan><tspan fill="#E6EDF3"> (</tspan><tspan fill="#D2A8FF">HOST_64BIT</tspan><tspan fill="#E6EDF3">) </tspan><tspan fill="#FF7B72">&amp;&amp;</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#FF7B72">!</tspan><tspan fill="#D2A8FF">defined</tspan><tspan fill="#E6EDF3"> (</tspan><tspan fill="#D2A8FF">BUILD_AS_STANDALONE</tspan><tspan fill="#E6EDF3">) </tspan><tspan fill="#FF7B72">&amp;&amp;</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#FF7B72">!defined</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#D2A8FF">__sun</tspan><tspan fill="#E6EDF3">) </tspan><tspan fill="#FF7B72">&amp;&amp;</tspan><tspan fill="#E6EDF3"> (</tspan><tspan fill="#FF7B72">!defined</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#D2A8FF">HOST_APPLE</tspan><tspan fill="#E6EDF3">) </tspan><tspan fill="#FF7B72">||</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#FF7B72">defined</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#D2A8FF">HOST_OSX</tspan><tspan fill="#E6EDF3">))</tspan></text>
  <text x="53" y="474" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#484f58" text-anchor="end">153</text>
  <text x="79" y="474" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#FF7B72">#define</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#D2A8FF">USE_REGIONS</tspan><tspan fill="#E6EDF3"></tspan></text>
</svg>