  <text x="79" y="672" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">        /// as &lt;</tspan><tspan fill="#7EE787">see</tspan><tspan fill="#8B949E"> </tspan><tspan fill="#79C0FF">cref</tspan><tspan fill="#8B949E">=</tspan><tspan fill="#A5D6FF">&quot;Memory{T}&quot;</tspan><tspan fill="#8B949E">/&gt; but only used for reading to store a &lt;</tspan><tspan fill="#7EE787">see</tspan><tspan fill="#8B949E"> </tspan><tspan fill="#79C0FF">cref</tspan><tspan fill="#8B949E">=</tspan><tspan fill="#A5D6FF">&quot;ReadOnlyMemory{T}&quot;</tspan><tspan fill="#8B949E">/&gt;.</tspan></text>
